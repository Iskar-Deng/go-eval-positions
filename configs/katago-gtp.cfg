# Local Sabaki analysis: always use Chinese rules and 7.5 komi.
logToStderr = true
logAllGTPCommunication = false
logSearchInfo = false
rules = chinese
komi = 7.5
# Ignore Sabaki/SGF `komi` commands so every analysis stays at 7.5.
ignoreGTPAndForceKomi = 7.5
numSearchThreads = 8
nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
maxVisits = 500
ponderingEnabled = false
numNNServerThreadsPerModel = 1
metalDeviceToUseThread0 = 0
